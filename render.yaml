# Render Blueprint for the PrepPilot API (Option A free deployment) •
# Deploy: push this file, then in Render - New - Blueprint, point at this repo.
# Secrets marked 'sync: false' must be filled in the Render dashboard.
services:
  - type: web
    name: preppilot-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.api
    # Build context is the repo root so backend/ and the seed CSV are available.
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      # Render routes external traffic to this port; Spring reads SERVER_PORT.
      - key: SERVER_PORT
        value: "8080"
      - key: PORT
        value: "8080"
      # SerialGC keeps the heap footprint small enough for the free 512 MB plan.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseSerialGC

      # -- Neon PostgreSQL (fill in the dashboard) ---
      # DATABASE_URL example: jdbc: postgresql: //<host>/<db>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

      # -- Auth / session ---
      - key: AUTH_TOKEN_PEPPER
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: Strict
      - key: EXPOSE_DEV_OTP
        value: "false"

      # -- Public URL / proxy handling
      # Set both to your Vercel URL, e. g. https://preppilot.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: FORWARD_HEADERS_STRATEGY
        value: FRAMEWORK

      # --- Email OTP via Brevo HTTP API (SMTP ports are blocked on Render freee) ---
      - key: MAIL_ENABLED
        value: "true"
      - key: MAIL_PROVIDER
        value: brevo
      # Brevo API key is generated in the Brevo dashboard (SMTP-only keys are ignored).
      - key: BREVO_API_KEY
        sync: false
      # MAIL_FROM must use your Brevo verified sender email address, e. g. PrepPilot <you@gmail.com>
      - key: MAIL_FROM
        sync: false
      - key: FEEDBACK_RECIPIENT_EMAIL
        sync: false

      # --- Runner stays off until phase 2 ---
      - key: RUNNER_ENABLED
        value: "false"
